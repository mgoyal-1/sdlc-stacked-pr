name: 'Prune PR state dummy'

on:
  pull_request_target:
    types: [closed, converted_to_draft]
    branches: [ 'devcloud-stable']

jobs:
  block-stacked-prs:
    runs-on: ubuntu-latest
    if: |
      (github.event.action == 'converted_to_draft' && github.event.pull_request.base.ref == 'devcloud-stable') ||
      (github.event.pull_request.merged == false && github.event.action == 'closed' && github.event.pull_request.draft==false && github.event.pull_request.base.ref == 'devcloud-stable') ||
      (github.event.pull_request.merged == true && (github.event.pull_request.base.ref == 'main' || github.event.pull_request.base.ref == 'master'))
    steps:
      - name: Echo pr closed 
        run: |
          echo "PR closed"
